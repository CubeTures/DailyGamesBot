[project]
name = "daily-games-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
	"discord-py>=2.7.1",
	"jinja2>=3.1.6",
	"mitmproxy==11.1.3",
	"pydantic>=2.13.5",
	"python-dotenv>=1.2.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
	"E",   # pycodestyle errors
	"F",   # pyflakes
	"I",   # isort
	"UP",  # pyupgrade
	"B",   # flake8-bugbear
	"SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.format]
# Defaults already match Black's style (quotes, indent, line endings, ...).
docstring-code-format = true

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
# mitmproxy's Headers class (`class Headers(multidict.MultiDict):  # type: ignore`)
# and its logging helpers are only partially typed upstream, so member access
# through them reports as Unknown under strict mode. Downgrade that one rule to
# information; values taken from them still need annotating.
reportUnknownMemberType = "information"

[dependency-groups]
dev = ["pre-commit>=4.6.2", "pyright>=1.1.414", "ruff>=0.16.7"]
