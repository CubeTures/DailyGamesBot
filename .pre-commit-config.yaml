repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      # Validates games/*/ and regenerates games/schema.json from the
      # models; a stale schema shows up as a modified file and fails the commit.
      - id: game-configs
        name: game configs
        entry: uv run python3 -m src.proxy.config
        language: system
        files: ^(games/|src/proxy/config\.py$)
        pass_filenames: false
