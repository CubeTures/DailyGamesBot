#:schema ../schema.json

name = "dailyorbs"
title = "Orbs"
description = "Four trivia puzzles a day, three orbs each. Collect six orbs to win the day."
icon = "icon.png"
origin = "https://dailyorbs.com"
landing_path = "/"
higher_score_wins = true

# Midnight Hawaii-Aleutian time: the server's game day rolled over at
# 09:00 UTC (nextRollover in /api/game-day) during daylight saving time.
[reset]
time = "00:00"
timezone = "America/Adak"

[[triggers]]
name = "day-state"
type = "page"
when = "finished"
