name = "wordle"
title = "Wordle"
origin = "https://www.nytimes.com"
port = 8081
landing_path = "/games/wordle/index.html"

# NYT keeps game state in localStorage under games-state-wordleV2/<user>
# ("ANON" when logged out), rewritten after every guess:
#   {"states": [{"puzzleId": "985", "printDate": "2026-10-06",
#     "data": {"boardState": ["crane", "pluto", "dimly", "", "", ""],
#              "currentRowIndex": 3, "status": "WIN", "hardMode": false,
#              "isPlayingArchive": false}}]}
# status is IN_PROGRESS while playing. A loss is caught by all six rows being
# used, whatever NYT names that status.
[[triggers]]
name = "local-state"
type = "page"
when = '''st && (st.data.status === "WIN" || (st.data.status !== "IN_PROGRESS" && st.data.currentRowIndex >= 6))'''

[triggers.vars]
st = '''(() => {
  const key = Object.keys(localStorage).find(k => k.startsWith("games-state-wordleV2/"));
  return ls(key)?.states?.find(s => s.printDate && s.data && !s.data.isPlayingArchive);
})()'''

[triggers.fields]
puzzle_id = '''st.printDate'''
# The public "Wordle 1,935" number: days since the 2021-06-19 launch.
puzzle_number = '''Math.round((Date.parse(st.printDate) - Date.parse("2021-06-19")) / 864e5)'''
won = '''st.data.status === "WIN"'''
attempts = '''st.data.currentRowIndex'''
score = '''st.data.status === "WIN" ? st.data.currentRowIndex : null // null = X/6'''
max_score = '''6'''
guesses = '''st.data.boardState.filter(Boolean)'''
hard_mode = '''!!st.data.hardMode'''
