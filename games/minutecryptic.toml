name = "minutecryptic"
title = "Minute Cryptic"
origin = "https://www.minutecryptic.com"
port = 8083
landing_path = "/"

# The daily puzzle's onGameEnd writes mc-daily-solves-2[<date>] =
# {ds, h: helpUsed ("HINT"/"LETTER" per use), st: startedAt, ct: completedAt}.
# It runs both when solved and when every letter has been revealed (the game's
# "gave_up" result), and nothing writes it mid-game. Archive puzzles key on
# their own date, so looking up today() ignores them. mc-puzzle holds the
# daily puzzle's state, including the par the game scores against.
[[triggers]]
name = "daily-solves"
type = "page"
when = '''!!s'''

[triggers.vars]
d = '''today()'''
s = '''ls("mc-daily-solves-2")?.[d]'''
p = '''(() => { const p = ls("mc-puzzle"); return p?.date === d ? p : null; })()'''
# Same as the game's own score: puzzles from 2025-09-22 on use averagePar.
par = '''p?.parDetails?.averagePar ?? p?.par'''

[triggers.fields]
puzzle_id = '''d'''
# Revealing every letter ends the game as "gave_up" (letterRevealOrder empties).
won = '''p ? p.letterRevealOrder.length > 0 : null'''
# Help used minus par: negative is under par ("4 under par" is -4).
score = '''par != null ? s.h.length - par : null'''
par = '''par'''
hints = '''s.h.filter(x => x === "HINT").length'''
letters_revealed = '''s.h.filter(x => x === "LETTER").length'''
time_secs = '''s.st && s.ct ? Math.round((Date.parse(s.ct) - Date.parse(s.st)) / 1000) : null'''
